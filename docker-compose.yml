services:
  postgres:
    image: postgres:16
    container_name: postgres
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=todo
      - POSTGRES_USER=me
      - POSTGRES_PASSWORD=pass 
    ports:
      - "5432:5432" 
    networks:
      - postgresnet
  web:
    build: . 
    container_name: todo_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://me:pass@postgres:5432/todo
    depends_on:
      - postgres 
    networks:
      - postgresnet
volumes:
  postgresql_data:
    driver: local

networks:
  postgresnet:
    driver: bridge